# 1단계: 인프라 3개 (DB, 큐, 메일)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:                                  # API 서버
    build: ./app
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0           # ← 추가
      WATCHFILES_FORCE_POLLING: "true"  # Windows에서 코드 수정을 감지하게 함
      PYTHONUNBUFFERED: "1"                     # ← 추가 (print 가 로그에 바로 보이게)
    volumes:
      - ./app:/app                      # 내 PC의 app 폴더 = 컨테이너의 /app (수정 즉시 반영)
    depends_on:
      postgres:
        condition: service_healthy
      redis:                                    # ← 추가
        condition: service_started
    # ports를 일부러 열지 않음 → 밖에서는 Nginx를 통해서만 들어올 수 있다

  worker:
    build: ./app
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      SMTP_HOST: mailpit                              # ← 추가 (⑧)
      SMTP_PORT: "1025"                               # ← 추가
      LLM_MODE: ${LLM_MODE:-fake}                     # ← 추가 (⑦) .env 에 없으면 fake
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}       # ← 추가 .env 에서 읽어옴
    volumes:
      - ./app:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  collector:                                    # 수집 서버 (1개만 실행)
    build: ./app
    command: python collector.py
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      PYTHONUNBUFFERED: "1"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
      COLLECT_INTERVAL_SECONDS: "300"           # 5분마다 (연습용)
    volumes:
      - ./app:/app
    depends_on:
      postgres:
        condition: service_healthy
  nginx:                                # 웹 서버
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata: