server {
    listen 80;

    # ① 화면 파일: web 폴더의 index.html
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # ② /api 로 시작하는 요청은 API 컨테이너로 전달 (리버스 프록시)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}